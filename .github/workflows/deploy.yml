name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  # Nocne przebudowanie — fetch-episodes zaciąga świeże odcinki z YouTube
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Domyślnie nic. Uprawnienia nadajemy osobno każdemu zadaniu, bo zadanie
# budujące uruchamia kod zależności z npm i nie ma powodu, żeby mogło
# publikować cokolwiek ani prosić o token tożsamości.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build # prebuild odpala scripts/fetch-episodes.mjs
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Tylko to zadanie publikuje, więc tylko ono dostaje prawo zapisu
    # do Pages i token tożsamości. Nie uruchamia kodu z zależności.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Domyślne 10 minut potrafi nie wystarczyć, gdy publikacja po
          # stronie Pages się ślimaczy. Po przekroczeniu limitu akcja nie
          # tylko zgłasza błąd: ANULUJE trwający deployment, więc zmiana
          # nie trafia na stronę mimo poprawnego builda. Wolimy poczekać.
          timeout: 1800000
