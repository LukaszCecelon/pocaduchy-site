name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  # Nocne przebudowanie — fetch-episodes zaciąga świeże odcinki z YouTube
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Domyślnie nic. Uprawnienia nadajemy osobno każdemu zadaniu, bo zadanie
# budujące uruchamia kod zależności z npm i nie ma powodu, żeby mogło
# publikować cokolwiek ani prosić o token tożsamości.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build # prebuild odpala scripts/fetch-episodes.mjs
      # Komplet akcji Pages w wersjach natywnych dla Node 24. Starsze majory
      # celowaly w Node 20 i runner uruchamial je na Node 24 na sile, przez co
      # odpytywanie o status publikacji nigdy nie widzialo sukcesu.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Tylko to zadanie publikuje, więc tylko ono dostaje prawo zapisu
    # do Pages i token tożsamości. Nie uruchamia kodu z zależności.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # Uwaga na przyszłość: parametru "timeout" nie ma sensu podnosić.
        # Akcja przycina go do twardego maksimum 600000 ms, czyli 10 minut,
        # i wypisuje o tym tylko ostrzeżenie. Gdy publikacja po stronie Pages
        # przekracza ten czas, akcja ANULUJE gotowy deployment. Wtedy jedyne
        # wyjście to ponowne uruchomienie albo zmiana sposobu publikacji.
        uses: actions/deploy-pages@v5
